name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libsdl2-dev libfreetype-dev libpng-dev \
            libjpeg-dev zlib1g-dev
          python -m pip install --disable-pip-version-check "cmake>=3.31,<5" ninja

      - name: Validate Store metadata and assets
        run: |
          python scripts/validate_store_assets.py
          python scripts/validate_font_assets.py

      - name: Configure
        run: cmake --preset linux-x86-64

      - name: Build
        run: cmake --build --preset linux-x86-64-dbg --parallel 2

      - name: Test
        run: ctest --test-dir build/linux-x86-64 -C Debug --output-on-failure

      - name: Smoke-test all locales and audio states
        run: scripts/smoke_locales.sh ./build/linux-x86-64/Debug/cardputerzero-sdr locale-smoke

      - name: Capture demo and device states
        run: scripts/capture_demo_states.sh ./build/linux-x86-64/Debug/cardputerzero-sdr demo-states

      - name: Verify smoke tests did not modify repository defaults
        run: git diff --exit-code -- config/cardputerzero-sdr.conf

      - name: Upload locale screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locale-smoke-${{ github.run_id }}
          path: locale-smoke/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload demo-state screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-states-${{ github.run_id }}
          path: demo-states/*
          if-no-files-found: warn
          retention-days: 14
