name: Device Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            dpkg-dev fakeroot ca-certificates curl git
          python -m pip install --disable-pip-version-check "cmake>=3.31,<5" ninja

      - name: Cache Cardputer Zero BSP and fetched sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: cp0-bsp-v0.0.4-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/toolchains/cp0-aarch64-linux-gnu.cmake') }}
          restore-keys: |
            cp0-bsp-v0.0.4-${{ runner.os }}-

      - name: Configure, build, and package
        run: cmake --workflow --preset cp0-cross-package

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          package=$(find dist -maxdepth 1 -name 'cardputerzero-sdr_*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Package)" = "cardputerzero-sdr"
          test "$(dpkg-deb -f "$package" Architecture)" = "arm64"
          package_version=$(dpkg-deb -f "$package" Version)
          test "$(basename "$package")" = "cardputerzero-sdr_${package_version}_arm64.deb"
          dpkg-deb -c "$package" | tee /tmp/package-contents.txt
          if grep -q '/systemd/system/' /tmp/package-contents.txt; then
            echo "unexpected system service in package" >&2
            exit 1
          fi
          grep -q '/usr/bin/cardputerzero-sdr$' /tmp/package-contents.txt
          grep -q '/usr/bin/cardputerzero-sdr-p0$' /tmp/package-contents.txt
          grep -q '/etc/cardputerzero-sdr.conf$' /tmp/package-contents.txt
          grep -q '/usr/share/APPLaunch/applications/cardputerzero-sdr.desktop$' /tmp/package-contents.txt
          grep -q '/usr/lib/cardputerzero-sdr/librtlsdr.so.2.0.3$' /tmp/package-contents.txt
          grep -q '/usr/share/doc/cardputerzero-sdr/README.md$' /tmp/package-contents.txt
          grep -q '/usr/share/doc/cardputerzero-sdr/README.zh-CN.md$' /tmp/package-contents.txt
          grep -q '/usr/share/doc/cardputerzero-sdr/librtlsdr-GPL-2.0-or-later.txt$' /tmp/package-contents.txt
          package_root=$(mktemp -d)
          dpkg-deb -x "$package" "$package_root"
          test -x "$package_root/usr/bin/cardputerzero-sdr-p0"
          if strings "$package_root/usr/bin/cardputerzero-sdr" | grep -Fq "$GITHUB_WORKSPACE"; then
            echo "device binary exposes the transient CI build root" >&2
            exit 1
          fi
          sh -n "$package_root/usr/bin/cardputerzero-sdr-p0"
          "$package_root/usr/bin/cardputerzero-sdr-p0" --help | grep -q 'preflight-only'
          control_dir=$(mktemp -d)
          dpkg-deb -e "$package" "$control_dir"
          test ! -e "$control_dir/preinst"
          test ! -e "$control_dir/postinst"
          test ! -e "$control_dir/prerm"
          test ! -e "$control_dir/postrm"
          depends=$(dpkg-deb -f "$package" Depends)
          grep -qw 'libasound2' <<<"$depends"
          grep -qw 'libusb-1.0-0' <<<"$depends"
          grep -qw 'librtlsdr0' <<<"$depends"
          dpkg-deb -I "$package"

      - name: Validate current Store server policy
        shell: bash
        env:
          STORE_POLICY_COMMIT: f271a66ed8bb9a3d26a3d9baabf75c09b4d505c9
          STORE_POLICY_SHA256: 754a7e07925dddd5964ae5a0a4def94a8e4a0e5456a83065f386c65490b9a564
        run: |
          set -euo pipefail
          package=$(find dist -maxdepth 1 -name 'cardputerzero-sdr_*.deb' -print -quit)
          test -n "$package"

          policy=/tmp/cardputerzero-install-path-policy.py
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/CardputerZero/packages/${STORE_POLICY_COMMIT}/.github/scripts/install_path_policy.py" \
            --output "$policy"
          printf '%s  %s\n' "$STORE_POLICY_SHA256" "$policy" | sha256sum --check --strict -

          bad_paths=/tmp/store-bad-paths.txt
          path_help=/tmp/store-path-help.md
          python3 "$policy" cardputerzero-sdr "$package" "$bad_paths" "$path_help"
          if test -s "$bad_paths"; then
            echo "package violates the current Store install-path policy" >&2
            cat "$bad_paths" >&2
            exit 1
          fi

          dpkg-deb -c "$package" > /tmp/store-package-contents.txt
          if awk '{print $1}' /tmp/store-package-contents.txt | grep -qE '^[-l].{2}[sS]|^[-l].{5}[sS]'; then
            echo "package contains setuid/setgid files" >&2
            exit 1
          fi
          if awk '{print $1}' /tmp/store-package-contents.txt | grep -qE '^[bc]'; then
            echo "package contains device files" >&2
            exit 1
          fi

          control_dir=$(mktemp -d)
          dpkg-deb -e "$package" "$control_dir"
          for maintainer_script in preinst postinst prerm postrm; do
            script="$control_dir/$maintainer_script"
            test -f "$script" || continue
            if grep -qE 'rm[[:space:]]+(-[a-zA-Z]+[[:space:]]+)*(/([[:space:]]|$)|/(bin|etc|usr|var|home|boot|lib))|(curl|wget)[^|]*\|[[:space:]]*(ba)?sh|mkfs|/etc/(passwd|shadow|sudoers)|dd[[:space:]][^|]*of=/dev/' "$script"; then
              echo "dangerous pattern in maintainer script: $maintainer_script" >&2
              exit 1
            fi
          done

      - name: Upload ARM64 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardputerzero-sdr-arm64-${{ github.run_id }}
          path: dist/cardputerzero-sdr_*.deb
          if-no-files-found: error
          retention-days: 30
